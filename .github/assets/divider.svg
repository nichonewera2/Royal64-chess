<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 40" width="100%" height="40">
  <defs>
    <linearGradient id="lineFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0a83c" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f0a83c" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f0a83c" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <line x1="0" y1="20" x2="1200" y2="20" stroke="url(#lineFade)" stroke-width="1.5"/>
  <circle cx="0" cy="20" r="4.5" fill="#ffe3ab">
    <animate attributeName="cx" values="0;1200" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite" keyTimes="0;0.08;0.92;1"/>
  </circle>
  <circle cx="605" cy="20" r="3" fill="#f0a83c" opacity="0.7">
    <animateTransform attributeName="transform" type="rotate" values="0 600 20;360 600 20" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
