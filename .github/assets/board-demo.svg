<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480">
  <defs>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a2716"/>
      <stop offset="100%" stop-color="#150d06"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#efdcb8"/>
      <stop offset="100%" stop-color="#d4ac6e"/>
    </linearGradient>
  </defs>

  <!-- 6x6 board for a compact demo -->
  <g id="board">
    <!-- generated 6x6 checker -->
    <g>
      <!-- row 0 -->
      <rect x="0" y="0" width="80" height="80" fill="url(#light)"/>
      <rect x="80" y="0" width="80" height="80" fill="url(#dark)"/>
      <rect x="160" y="0" width="80" height="80" fill="url(#light)"/>
      <rect x="240" y="0" width="80" height="80" fill="url(#dark)"/>
      <rect x="320" y="0" width="80" height="80" fill="url(#light)"/>
      <rect x="400" y="0" width="80" height="80" fill="url(#dark)"/>
      <!-- row 1 -->
      <rect x="0" y="80" width="80" height="80" fill="url(#dark)"/>
      <rect x="80" y="80" width="80" height="80" fill="url(#light)"/>
      <rect x="160" y="80" width="80" height="80" fill="url(#dark)"/>
      <rect x="240" y="80" width="80" height="80" fill="url(#light)"/>
      <rect x="320" y="80" width="80" height="80" fill="url(#dark)"/>
      <rect x="400" y="80" width="80" height="80" fill="url(#light)"/>
      <!-- row 2 -->
      <rect x="0" y="160" width="80" height="80" fill="url(#light)"/>
      <rect x="80" y="160" width="80" height="80" fill="url(#dark)"/>
      <rect x="160" y="160" width="80" height="80" fill="url(#light)"/>
      <rect x="240" y="160" width="80" height="80" fill="url(#dark)"/>
      <rect x="320" y="160" width="80" height="80" fill="url(#light)"/>
      <rect x="400" y="160" width="80" height="80" fill="url(#dark)"/>
      <!-- row 3 -->
      <rect x="0" y="240" width="80" height="80" fill="url(#dark)"/>
      <rect x="80" y="240" width="80" height="80" fill="url(#light)"/>
      <rect x="160" y="240" width="80" height="80" fill="url(#dark)"/>
      <rect x="240" y="240" width="80" height="80" fill="url(#light)"/>
      <rect x="320" y="240" width="80" height="80" fill="url(#dark)"/>
      <rect x="400" y="240" width="80" height="80" fill="url(#light)"/>
      <!-- row 4 -->
      <rect x="0" y="320" width="80" height="80" fill="url(#light)"/>
      <rect x="80" y="320" width="80" height="80" fill="url(#dark)"/>
      <rect x="160" y="320" width="80" height="80" fill="url(#light)"/>
      <rect x="240" y="320" width="80" height="80" fill="url(#dark)"/>
      <rect x="320" y="320" width="80" height="80" fill="url(#light)"/>
      <rect x="400" y="320" width="80" height="80" fill="url(#dark)"/>
      <!-- row 5 -->
      <rect x="0" y="400" width="80" height="80" fill="url(#dark)"/>
      <rect x="80" y="400" width="80" height="80" fill="url(#light)"/>
      <rect x="160" y="400" width="80" height="80" fill="url(#dark)"/>
      <rect x="240" y="400" width="80" height="80" fill="url(#light)"/>
      <rect x="320" y="400" width="80" height="80" fill="url(#dark)"/>
      <rect x="400" y="400" width="80" height="80" fill="url(#light)"/>
    </g>
  </g>
  <rect x="4" y="4" width="472" height="472" fill="none" stroke="#0f0a06" stroke-width="8"/>

  <!-- Highlighted trail squares that light up as the knight passes -->
  <g fill="#f0a83c">
    <rect x="40" y="440" width="80" height="80" opacity="0">
      <animate attributeName="opacity" values="0;0.35;0.35;0" dur="4.8s" begin="0s" repeatCount="indefinite" keyTimes="0;0.05;0.2;0.25"/>
    </rect>
    <rect x="200" y="360" width="80" height="80" opacity="0">
      <animate attributeName="opacity" values="0;0.35;0.35;0" dur="4.8s" begin="1.2s" repeatCount="indefinite" keyTimes="0;0.05;0.2;0.25"/>
    </rect>
    <rect x="360" y="200" width="80" height="80" opacity="0">
      <animate attributeName="opacity" values="0;0.35;0.35;0" dur="4.8s" begin="2.4s" repeatCount="indefinite" keyTimes="0;0.05;0.2;0.25"/>
    </rect>
    <rect x="200" y="40" width="80" height="80" opacity="0">
      <animate attributeName="opacity" values="0;0.35;0.35;0" dur="4.8s" begin="3.6s" repeatCount="indefinite" keyTimes="0;0.05;0.2;0.25"/>
    </rect>
  </g>

  <!-- The knight, hopping in an L-shaped loop across four squares -->
  <text font-size="64" fill="#f6e9cf" stroke="#150d06" stroke-width="1.5" text-anchor="middle" font-family="serif">
    &#9816;
    <animate attributeName="x"
      values="80;80;260;260;440;440;260;260;80"
      keyTimes="0;0.06;0.19;0.25;0.44;0.5;0.69;0.75;1"
      dur="4.8s" repeatCount="indefinite"/>
    <animate attributeName="y"
      values="480;440;440;360;360;240;240;80;80"
      keyTimes="0;0.06;0.19;0.25;0.44;0.5;0.69;0.75;1"
      dur="4.8s" repeatCount="indefinite"/>
  </text>
</svg>
