<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.06" numOctaves="4" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.16  0 0 0 0 0.11  0 0 0 0 0.07  0 0 0 0.35 0"/>
    </filter>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f150d"/>
      <stop offset="50%" stop-color="#2a1d12"/>
      <stop offset="100%" stop-color="#1f150d"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#base)"/>
  <rect width="400" height="400" filter="url(#grain)"/>
</svg>
