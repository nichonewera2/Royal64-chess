<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <pattern id="board" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="none"/>
      <rect width="50" height="50" fill="#f0a83c"/>
      <rect x="50" y="50" width="50" height="50" fill="#f0a83c"/>
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#000" stop-opacity="1"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <mask id="fadeMask">
      <rect width="800" height="800" fill="url(#fade)"/>
    </mask>
  </defs>
  <g mask="url(#fadeMask)">
    <rect width="800" height="800" fill="url(#board)"/>
  </g>
</svg>
